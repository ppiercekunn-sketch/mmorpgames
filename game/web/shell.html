<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
<title>$GODOT_PROJECT_NAME</title>
<!--
	Pockie Saints Remake - custom Godot 4.3 web shell.
	Based on the engine's default shell (platform/web/misc/full-size.html);
	the dollar-prefixed GODOT_ placeholders are filled in by the Web export.
	Optional: set window.POCKIE_API_URL before the engine starts (or open the
	page with ?api=https://host/api) to point the client at another backend.
-->
<style>
:root {
	--navy: #1d2440;
	--navy-dark: #121830;
	--panel: #232c4d;
	--border: #3a4670;
	--gold: #f4c542;
	--gold-dark: #c99a1e;
	--text: #ece8dc;
	--muted: #9aa3c0;
	--error-bg: #4a2a36;
	--error-border: #b8434e;
	/* Boot splash color from project settings (unused by the branded screen). */
	--godot-splash-color: $GODOT_SPLASH_COLOR;
}

html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: var(--text);
	background-color: var(--navy-dark);
	overflow: hidden;
	touch-action: none;
	font-family: 'Segoe UI', 'Noto Sans', 'Droid Sans', Arial, sans-serif;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status {
	position: absolute;
	inset: 0;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	gap: 1.25rem;
	padding: 0 1rem;
	background: radial-gradient(ellipse at 50% 20%, #2b3560 0%, var(--navy) 35%, var(--navy-dark) 100%);
	visibility: hidden;
	z-index: 1;
}

/* The engine's boot splash is replaced by the branded block below. */
#status-splash {
	display: none;
}

#status-logo {
	width: 72px;
	height: 72px;
}

#status-title {
	margin: 0;
	color: var(--gold);
	font-size: clamp(1.8rem, 5vw, 2.8rem);
	font-weight: 700;
	letter-spacing: 0.04em;
	text-align: center;
	text-shadow: 0 3px 0 rgba(0, 0, 0, 0.5);
}

#status-subtitle {
	margin: -0.75rem 0 0;
	color: var(--muted);
	font-size: 0.95rem;
	text-align: center;
}

#status-progress {
	width: min(420px, 80vw);
	height: 14px;
	border: 1px solid var(--border);
	border-radius: 7px;
	background: var(--panel);
	overflow: hidden;
	display: none;
}

#status-progress-fill {
	height: 100%;
	width: 0%;
	background: linear-gradient(90deg, var(--gold-dark), var(--gold));
	transition: width 0.2s ease-out;
}

/* Unknown total size (e.g. compressed transfer): sliding bar. */
#status-progress.indeterminate #status-progress-fill {
	width: 30%;
	animation: slide 1.2s ease-in-out infinite;
}

@keyframes slide {
	from { transform: translateX(-100%); }
	to { transform: translateX(340%); }
}

#status-text {
	min-height: 1.2em;
	color: var(--muted);
	font-size: 0.9rem;
	text-align: center;
}

#status-notice {
	display: none;
	max-width: 36rem;
	padding: 1rem;
	border: 1px solid var(--error-border);
	border-radius: 0.5rem;
	background-color: var(--error-bg);
	color: var(--text);
	line-height: 1.4;
	text-align: center;
}
</style>
$GODOT_HEAD_INCLUDE
</head>
<body>
	<canvas id="canvas">
		Your browser does not support the canvas tag.
	</canvas>

	<noscript>
		Your browser does not support JavaScript.
	</noscript>

	<div id="status">
		<img id="status-splash" class="$GODOT_SPLASH_CLASSES" src="$GODOT_SPLASH" alt="">
		<svg id="status-logo" viewBox="0 0 128 128" aria-hidden="true">
			<rect width="128" height="128" rx="20" fill="#1d2440" stroke="#3a4670" stroke-width="2"/>
			<polygon points="64,14 76,50 114,50 83,72 95,110 64,87 33,110 45,72 14,50 52,50" fill="#f4c542"/>
		</svg>
		<h1 id="status-title">Pockie Saints</h1>
		<p id="status-subtitle">Remake</p>
		<div id="status-progress" role="progressbar" aria-label="Loading">
			<div id="status-progress-fill"></div>
		</div>
		<div id="status-text">Loading...</div>
		<div id="status-notice" role="alert"></div>
	</div>

	<script src="$GODOT_URL"></script>
	<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusFill = document.getElementById('status-progress-fill');
	const statusText = document.getElementById('status-text');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusText.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusText(text) {
		statusText.textContent = text;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	function formatMegabytes(bytes) {
		return (bytes / (1024 * 1024)).toFixed(1);
	}

	function onProgress(current, total) {
		if (current > 0 && total > 0) {
			statusProgress.classList.remove('indeterminate');
			const percent = Math.min(100, (current / total) * 100);
			statusFill.style.width = percent.toFixed(1) + '%';
			statusProgress.setAttribute('aria-valuenow', Math.round(percent));
			if (current >= total) {
				setStatusText('Starting...');
			} else {
				setStatusText('Downloading ' + formatMegabytes(current) + ' / '
					+ formatMegabytes(total) + ' MB');
			}
		} else {
			statusProgress.classList.add('indeterminate');
			statusFill.style.width = '';
			setStatusText(current > 0 ? 'Downloading ' + formatMegabytes(current) + ' MB' : 'Loading...');
		}
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				navigator.serviceWorker.getRegistration().then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).catch((err) => {
				console.error('Error while registering service worker:', err);
			}).then(() => {
				window.location.reload();
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		onProgress(0, 0);
		engine.startGame({
			'onProgress': onProgress,
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
	</script>
</body>
</html>
